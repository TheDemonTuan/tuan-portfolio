name: edge

services:
  cloudflared:
    image: ${CLOUDFLARED_IMAGE:-cloudflare/cloudflared@sha256:51c9cefcb4569df44e1ad403ab1d3d8065aa8e84339bcfc6aee75502e1140339}
    container_name: edge-cloudflared
    restart: unless-stopped
    user: "1000:1000"
    command: tunnel --no-autoupdate run --token-file /run/secrets/tunnel-token
    depends_on:
      caddy:
        condition: service_healthy
    secrets:
      - tunnel-token
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 128m
    cpus: 0.25
    networks:
      egress:
        gw_priority: 1
      cf_ingress:
        ipv4_address: 172.31.250.2
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: ${CADDY_IMAGE:-caddy@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d}
    container_name: edge-caddy
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    pids_limit: 200
    mem_limit: 256m
    cpus: 0.50
    volumes:
      - ./config:/etc/caddy:ro,Z
    tmpfs:
      - /config:size=1m,mode=0700,uid=1000,gid=1000
      - /data:size=1m,mode=0700,uid=1000,gid=1000
      - /tmp:size=8m,mode=1777
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 6
    networks:
      cf_ingress:
        ipv4_address: 172.31.250.3
      portfolio:
    logging: *logging

secrets:
  tunnel-token:
    file: ./secrets/tunnel-token

networks:
  egress:
    name: edge-egress
    ipam:
      config:
        - subnet: 172.31.252.0/28
  cf_ingress:
    name: edge-cf-ingress
    internal: true
    ipam:
      config:
        - subnet: 172.31.250.0/28
  portfolio:
    external: true
    name: edge-portfolio
