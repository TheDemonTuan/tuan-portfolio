server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  charset utf-8;

  # The container is reached only through the Cloudflare Tunnel on a private
  # network. Without these, nginx builds redirects from its own host:port and
  # leaks http://<container>:8080/ into Location headers on directory URLs.
  absolute_redirect off;
  port_in_redirect off;

  # nginx does not inherit add_header into a location that declares its own, so
  # every header set below is repeated in the static-asset block on purpose.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://cloudflareinsights.com; frame-ancestors 'none'; base-uri 'self'; form-action 'none'; upgrade-insecure-requests" always;

  location = /healthz {
    access_log off;
    proxy_pass http://127.0.0.1:8081/healthz;
    proxy_http_version 1.1;
    proxy_set_header Connection close;
    proxy_connect_timeout 1s;
    proxy_read_timeout 2s;
    proxy_buffering off;
  }

  # Loopback only: exposing connection counts would disclose traffic state.
  location = /internal/nginx-status {
    stub_status;
    access_log off;
    allow 127.0.0.1;
    deny all;
  }

  location = /work/omniroute-vps-workflow {
    return 301 /work/blue-green-deploys-on-a-shared-vps/;
  }

  location = /work/omniroute-vps-workflow/ {
    return 301 /work/blue-green-deploys-on-a-shared-vps/;
  }

  location = /vi/work/omniroute-vps-workflow {
    return 301 /vi/work/blue-green-deploys-on-a-shared-vps/;
  }

  location = /vi/work/omniroute-vps-workflow/ {
    return 301 /vi/work/blue-green-deploys-on-a-shared-vps/;
  }

  location ~* \.(?:css|js|svg|ico|webmanifest|woff2)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://cloudflareinsights.com; frame-ancestors 'none'; base-uri 'self'; form-action 'none'; upgrade-insecure-requests" always;
    try_files $uri =404;
  }

  error_page 404 /404.html;

  location / {
    try_files $uri $uri/ =404;
  }

  location = /404.html {
    internal;
  }
}
