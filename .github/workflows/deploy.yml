name: Build and Deploy
run-name: ${{ inputs.skip_deploy && 'Build image only' || 'Build → GHCR → VPS' }}

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_deploy:
        description: Build and publish without deploying
        required: false
        type: boolean
        default: false

concurrency:
  group: tuan-portfolio-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Test and build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
      - run: bun ./node_modules/playwright/cli.js install --with-deps chromium
      - run: bun run test

  build:
    name: Build immutable image
    needs: test
    permissions:
      contents: read
      packages: write
    uses: TheDemonTuan/vps-deploy/.github/workflows/build-docker.yml@e5d34609ed81a5200174469706b3bd899aa7a02b
    with:
      app: tuan-portfolio
      source-sha: ${{ github.sha }}
      platform-ref: e5d34609ed81a5200174469706b3bd899aa7a02b
      config: .deploy/app.yml
      component: app

  deploy:
    name: Deploy to VPS
    needs: build
    if: ${{ !inputs.skip_deploy }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: production
      url: https://tuannguyenviet.site
    steps:
      - name: Deploy application via platform
        uses: TheDemonTuan/vps-deploy/.github/actions/deploy@e5d34609ed81a5200174469706b3bd899aa7a02b
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        with:
          app: tuan-portfolio
          host: oracle-main
          operation: deploy
          component: app
          source-sha: ${{ github.sha }}
          platform-ref: e5d34609ed81a5200174469706b3bd899aa7a02b
          config: .deploy/app.yml
          image-ref: ${{ needs.build.outputs.image-ref }}
