name: Pull request CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate portfolio
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Check types and formatting
        run: bun run check
      - name: Build production site
        run: bun run build
      - name: Install test browser
        run: bun ./node_modules/playwright/cli.js install --with-deps chromium
      - name: Run browser regression tests
        run: bun run test

  required:
    name: Required CI
    if: ${{ always() }}
    needs: [validate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful validation
        env:
          VALIDATION_RESULT: ${{ needs.validate.result }}
        run: |
          if [ "$VALIDATION_RESULT" != "success" ]; then
            echo "Portfolio validation did not succeed: $VALIDATION_RESULT"
            exit 1
          fi
